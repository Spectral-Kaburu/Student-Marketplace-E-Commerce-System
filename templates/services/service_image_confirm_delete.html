{% extends "base.html" %}
{% block content %}
<div class="card card-pad" style="max-width:560px;margin:0 auto;">
    <h1 class="section-title" style="font-size:22px;">Delete image?</h1>
    <p style="margin-top:8px;">Are you sure you want to delete this image from <strong>{{ image.service.title }}</strong>? This cannot be undone.</p>
    <img src="{{ image.image.url }}" alt="Image to delete" style="max-width:300px;margin:16px 0;border-radius:var(--radius);">
    <form method="post" style="margin-top:16px;">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete image</button>
        <a href="{% url 'service_update' image.service.pk %}" class="btn btn-outline" style="margin-left:8px;">Cancel</a>
    </form>
</div>
{% endblock %}
