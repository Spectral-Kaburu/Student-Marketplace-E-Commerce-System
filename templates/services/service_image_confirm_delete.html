{% extends 'base.html' %}
{% block content %}
<div class="card card-pad" style="max-width:480px;margin:0 auto;">
    <h1 class="section-title" style="font-size:20px;">Delete this image?</h1>
    <div style="margin:16px 0;width:160px;height:160px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--amber-100);">
        {% if image.image %}
            <img src="{{ image.image.url }}" alt="Image to delete" style="width:100%;height:100%;object-fit:cover;">
        {% endif %}
    </div>
    <form method="post">
        {% csrf_token %}
        <div style="display:flex;justify-content:flex-end;gap:12px;">
            <a href="{% url 'service_update' image.service.pk %}" class="btn btn-outline">Cancel</a>
            <button type="submit" class="btn btn-danger">Delete</button>
        </div>
    </form>
</div>
{% endblock %}
